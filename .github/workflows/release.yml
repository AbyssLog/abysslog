name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:verify -- "$GITHUB_REF_NAME"

      - name: Verify release source
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]; then
            echo "::error::Release tags must be annotated tags"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit must be part of main"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build-unsigned-windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Electron runtime
        run: npm run setup

      - name: Build unsigned Windows installer
        run: npm run build:win:release

      - name: Smoke test packaged application
        run: npm run test:package:win

      - name: Create release checksums
        run: npm run release:checksums

      - name: Upload unsigned release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AbyssLog-Windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-unsigned-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download unsigned release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AbyssLog-Windows-${{ github.ref_name }}
          path: release

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "AbyssLog ${GITHUB_REF_NAME#v}"
