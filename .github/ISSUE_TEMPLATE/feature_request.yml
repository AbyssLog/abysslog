name: Feature request
description: Suggest a focused improvement to AbyssLog
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the player problem first. Please remember that ESI data can be delayed or unavailable and that AbyssLog is maintained on a best-effort basis.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is difficult today, and when does it happen?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or approaches you have tried.
